[project]
name = "r2ai-legal-rag"
version = "0.1.0"
description = "Competition-oriented Vietnamese legal RAG pipeline for R2AI 2026."
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.2",
  "lxml>=5",
]

[project.optional-dependencies]
rag = [
  "qdrant-client>=1.10",
  "llama-index>=0.10",
  "FlagEmbedding>=1.2",
  "transformers>=4.44.2,<5",
]
test = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["legal_rag*"]
